<!doctype html>
<!--
  Stateful-instance state isolation gate (browser level).
  Exercises the fork's actual compile wiring end to end: the tracked
  companion bundle (/_engine/hydra-synth.js),
  window.HydraEffects.loadHydraEffects(), and
  src/lib/noisemaker-runtime.mjs (createNoisemakerRuntime) against the
  pinned engine bundle (1.0.347, which carries upstream cf95f49c9007
  "Give each stateful effect instance in a chain its own state and size
  parameter"). Upstream cf95f49c9007 isolates repeated stateful state and
  preserves shared loop and mesh resources; upstream
  shaders/tests/test_stateful_instances.js covers those contracts against
  the engine's own runtime. This page drives the same contracts through the
  port's target runtime (the real WebGL2 backend on the pinned engine) so
  the isolation behavior is exercised where the port actually renders:
  repeated reactionDiffusion/watercolor/cellularAutomata instances get
  distinct per-instance state textures with per-instance zoom sizing,
  runtime zoom updates re-size only the addressed instance, single
  instances keep the legacy chain-scoped IDs, and the shared loop
  accumulator and shared mesh buffers keep their chain scope.
-->
<html><body><pre id="out">stateful-instances-boot</pre>
<script src="/_engine/hydra-synth.js"></script>
<script type="module">
import { createNoisemakerRuntime } from '/src/lib/noisemaker-runtime.mjs'
const pre = document.getElementById('out')

const canvas = document.createElement('canvas')
canvas.width = 1024; canvas.height = 1024
const renderer = await createNoisemakerRuntime({
  canvas,
  extension: window.HydraEffects,
  cdn: 'https://shaders.noisedeck.app/1.0.347',
  preferWebGPU: false
})
renderer.stop()

function fail (message) {
  throw new Error(message)
}

async function build (chain) {
  await renderer.compile(`search synth, mixer, filter, render\n${chain}\nrender(o0)`)
  const pipeline = renderer.pipeline
  if (!pipeline || !pipeline.graph || !Array.isArray(pipeline.graph.passes)) {
    fail('pipeline graph missing after compile')
  }
  return { graph: pipeline.graph, pipeline }
}

// Mirrors upstream test_stateful_instances.js instances(): each stateful
// effect instance (one node) must use exactly one state texture.
function instances (graph, effectFunc, statePrefix) {
  const nodes = new Map()
  for (const pass of graph.passes.filter(p => p.effectFunc === effectFunc)) {
    if (!nodes.has(pass.nodeId)) nodes.set(pass.nodeId, { passes: [], textures: new Set(), stepIndex: pass.stepIndex })
    const node = nodes.get(pass.nodeId)
    node.passes.push(pass)
    for (const texture of [...Object.values(pass.inputs || {}), ...Object.values(pass.outputs || {})]) {
      if (typeof texture === 'string' && texture.startsWith(statePrefix)) node.textures.add(texture)
    }
  }
  return [...nodes.values()].map(node => {
    if (node.textures.size !== 1) {
      fail(`all passes in a ${effectFunc} instance must use the same state (found ${node.textures.size})`)
    }
    return { ...node, texture: [...node.textures][0] }
  })
}

// Mirrors upstream assertSize(): the backend must hold a read and a write
// allocation of exactly the expected size for the state texture.
function assertSize (pipeline, texture, size, label) {
  for (const side of ['read', 'write']) {
    const spec = pipeline.backend.textures.get(`${texture}_${side}`)
    if (!spec) fail(`${label || texture}_${side} must be allocated`)
    if (spec.width !== size || spec.height !== size) {
      fail(`${label || texture}_${side} is ${spec.width}x${spec.height}, expected ${size}x${size}`)
    }
  }
}

function assert (condition, message) {
  if (!condition) fail(message)
}

const programs = {
  A: 'reactionDiffusion(zoom: x4).blendMode(tex: reactionDiffusion(zoom: x16)).write(o0)',
  B: 'perlin().blendMode(tex: reactionDiffusion(zoom: x4)).blendMode(tex: reactionDiffusion(zoom: x16)).write(o0)',
  C: 'perlin().watercolor().watercolor().write(o0)'
}

// upstream: program A and program B instances have independent state and zoom sizes
for (const id of ['A', 'B']) {
  const { graph, pipeline } = await build(programs[id])
  const nodes = instances(graph, 'reactionDiffusion', 'global_rd_state')
  assert(nodes.length === 2, `program ${id}: expected 2 reactionDiffusion instances, got ${nodes.length}`)
  assert(nodes[0].texture !== nodes[1].texture, `program ${id}: state textures must be distinct`)
  assertSize(pipeline, nodes[0].texture, 256, `program ${id} instance 0`)
  assertSize(pipeline, nodes[1].texture, 64, `program ${id} instance 1`)
  const expectedZoom = [4, 16]
  for (const [index, node] of nodes.entries()) {
    const sizingParam = graph.textures.get(node.texture).width.screenDivide
    for (const pass of node.passes) {
      assert(pass.scopedParams.zoom === sizingParam, `program ${id}: pass scopedParams.zoom must match the sizing parameter`)
      assert(pass.uniforms[sizingParam] === expectedZoom[index], `program ${id}: ${sizingParam} must be ${expectedZoom[index]}`)
    }
  }
}

// upstream: changing one instance's zoom leaves the other's state size and uniform intact
for (const id of ['A', 'B']) {
  const { graph, pipeline } = await build(programs[id])
  const nodes = instances(graph, 'reactionDiffusion', 'global_rd_state')
  renderer.applyStepParameterValues({ [`step_${nodes[1].stepIndex}`]: { zoom: 2 } })
  assertSize(pipeline, nodes[0].texture, 256, `${id} after step_1 zoom=2: instance 0`)
  assertSize(pipeline, nodes[1].texture, 512, `${id} after step_1 zoom=2: instance 1`)
  renderer.applyStepParameterValues({ [`step_${nodes[0].stepIndex}`]: { zoom: 32 } })
  assertSize(pipeline, nodes[0].texture, 32, `${id} after step_0 zoom=32: instance 0`)
  assertSize(pipeline, nodes[1].texture, 512, `${id} after step_0 zoom=32: instance 1`)
  for (const pass of nodes[1].passes) {
    assert(pass.uniforms.zoom === 2, `${id}: addressed instance uniform zoom must be 2`)
  }
}

// upstream: program C watercolor instances have independent ping-pong state
{
  const { graph, pipeline } = await build(programs.C)
  const nodes = instances(graph, 'watercolor', 'global_wc_state')
  assert(nodes.length === 2, `watercolor: expected 2 instances, got ${nodes.length}`)
  assert(nodes[0].texture !== nodes[1].texture, 'watercolor: state textures must be distinct')
  for (const node of nodes) assertSize(pipeline, node.texture, 1024, 'watercolor state')
}

// upstream: different stateful effects in one chain size from their own zoom
for (const chain of [
  'reactionDiffusion(zoom: x4).blendMode(tex: cellularAutomata(zoom: x16)).write(o0)',
  'perlin().blendMode(tex: reactionDiffusion(zoom: x4)).blendMode(tex: cellularAutomata(zoom: x16)).write(o0)'
]) {
  const { graph, pipeline } = await build(chain)
  const [rd] = instances(graph, 'reactionDiffusion', 'global_rd_state')
  const [ca] = instances(graph, 'cellularAutomata', 'global_ca_state')
  assert(rd.texture === 'global_rd_state_chain_0', `rd texture is ${rd.texture}`)
  assert(ca.texture === 'global_ca_state_chain_0', `ca texture is ${ca.texture}`)
  const rdParam = graph.textures.get(rd.texture).width.screenDivide
  const caParam = graph.textures.get(ca.texture).width.screenDivide
  assert(rdParam !== caParam, 'size parameters must be distinct')
  assertSize(pipeline, rd.texture, 256, 'rd own zoom')
  assertSize(pipeline, ca.texture, 64, 'ca own zoom')
  renderer.applyStepParameterValues({ [`step_${ca.stepIndex}`]: { zoom: 2 } })
  assertSize(pipeline, rd.texture, 256, 'rd after ca zoom=2')
  assertSize(pipeline, ca.texture, 512, 'ca after ca zoom=2')
  renderer.applyStepParameterValues({ [`step_${rd.stepIndex}`]: { zoom: 32 } })
  assertSize(pipeline, rd.texture, 32, 'rd after rd zoom=32')
  assertSize(pipeline, ca.texture, 512, 'ca after rd zoom=32')
}

// upstream: loopBegin and loopEnd retain their shared accumulator
for (const chain of [
  'perlin().loopBegin().loopEnd().write(o0)',
  'perlin().loopBegin().loopEnd().loopBegin().loopEnd().write(o0)'
]) {
  const { graph } = await build(chain)
  for (const pass of graph.passes) {
    if (pass.effectFunc === 'loopBegin') {
      assert(pass.inputs.accumTex === 'global_accum_chain_0', `loopBegin accumTex is ${pass.inputs.accumTex}`)
    }
    if (pass.effectFunc === 'loopEnd' && (pass.outputs.fragColor || '').startsWith('global_')) {
      assert(pass.outputs.fragColor === 'global_accum_chain_0', `loopEnd fragColor is ${pass.outputs.fragColor}`)
    }
  }
}

// upstream: meshLoader and meshRender retain their shared mesh buffers
{
  const { graph } = await build('meshLoader().meshRender().meshRender().write(o0)')
  const loader = graph.passes.find(p => p.effectFunc === 'meshLoader')
  const renderers = graph.passes.filter(p => p.effectFunc === 'meshRender' && p.inputs.meshPositions)
  assert(renderers.length === 2, `expected 2 meshRender passes, got ${renderers.length}`)
  assert(loader.inputs.positionsTex === 'global_mesh0_positions_chain_0', `loader positionsTex is ${loader.inputs.positionsTex}`)
  assert(loader.inputs.normalsTex === 'global_mesh0_normals_chain_0', `loader normalsTex is ${loader.inputs.normalsTex}`)
  for (const meshRenderer of renderers) {
    assert(meshRenderer.inputs.meshPositions === loader.inputs.positionsTex, 'meshRender must read the loader positions buffer')
    assert(meshRenderer.inputs.meshNormals === loader.inputs.normalsTex, 'meshRender must read the loader normals buffer')
  }
}

// upstream: repeated state preserves each explicit or default zoom
{
  const { graph, pipeline } = await build('reactionDiffusion(zoom: x4).blendMode(tex: reactionDiffusion()).blendMode(tex: reactionDiffusion(zoom: x16)).write(o0)')
  const nodes = instances(graph, 'reactionDiffusion', 'global_rd_state')
  assert(new Set(nodes.map(node => node.texture)).size === 3, 'three instances must keep three state textures')
  const expectedSizes = [256, 128, 64]
  for (const [index, node] of nodes.entries()) {
    assertSize(pipeline, node.texture, expectedSizes[index], `repeated state instance ${index}`)
  }
}

// upstream: repeated mesh renderers keep external buffers when the loader is in another chain
{
  await renderer.compile('search synth, mixer, filter, render\nmeshLoader().write(o0)\nread(o0).meshRender().meshRender().write(o1)\nrender(o0)')
  const graph = renderer.pipeline.graph
  const renderers = graph.passes.filter(p => p.effectFunc === 'meshRender' && p.inputs.meshPositions)
  assert(renderers.length === 2, `expected 2 cross-chain meshRender passes, got ${renderers.length}`)
  for (const meshRenderer of renderers) {
    assert(meshRenderer.inputs.meshPositions === 'global_mesh0_positions_chain_1', `cross-chain positions are ${meshRenderer.inputs.meshPositions}`)
    assert(meshRenderer.inputs.meshNormals === 'global_mesh0_normals_chain_1', `cross-chain normals are ${meshRenderer.inputs.meshNormals}`)
  }
}

// upstream: single instances retain their existing texture IDs
{
  await renderer.compile('search synth, mixer, filter, render\nperlin().write(o0)\nreactionDiffusion(zoom: x4).watercolor().write(o1)\nrender(o0)')
  const graph = renderer.pipeline.graph
  const pipeline = renderer.pipeline
  assert(instances(graph, 'reactionDiffusion', 'global_rd_state')[0].texture === 'global_rd_state_chain_1', 'single rd instance must keep the chain-scoped ID')
  assert(instances(graph, 'watercolor', 'global_wc_state')[0].texture === 'global_wc_state_chain_1', 'single watercolor instance must keep the chain-scoped ID')
  assertSize(pipeline, 'global_rd_state_chain_1', 256, 'single rd state')
}

document.getElementById('out').textContent = 'stateful-instances-ready'
</script>
<script>
window.addEventListener('error', event => {
  document.getElementById('out').textContent = `stateful-instances-error: ${event.message}`
})
window.addEventListener('unhandledrejection', event => {
  document.getElementById('out').textContent = `stateful-instances-error: ${event.reason && event.reason.message}`
})
</script></html>
