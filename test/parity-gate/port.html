<!doctype html>
<!--
  GAP-001 rendered-parity gate: PORT side.
  Exercises the fork's actual render wiring end to end: the tracked companion
  bundle (/_engine/hydra-synth.js), window.HydraEffects.loadHydraEffects(), and
  src/lib/noisemaker-runtime.mjs (createNoisemakerRuntime). Renders the same
  case programs as the authority side, compares the port's RGBA8 readbacks
  against the authority readbacks frame by frame, and reports exact equality
  separately from the legacy +-2 numerical contract.
-->
<html><body><pre id="out">port-boot</pre>
<script src="/_engine/hydra-synth.js"></script>
<script type="module">
import { createNoisemakerRuntime } from '/src/lib/noisemaker-runtime.mjs'
const pre = document.getElementById('out')
const canvas = document.createElement('canvas')
canvas.width = 32; canvas.height = 24
const renderer = await createNoisemakerRuntime({
  canvas,
  extension: window.HydraEffects,
  cdn: 'https://shaders.noisedeck.app/1.0.182',
  preferWebGPU: false
})
renderer.stop()

async function renderFrames (spec) {
  const { width, height } = spec.size
  if (canvas.width !== width || canvas.height !== height) renderer.resize(width, height)
  await renderer.compile(spec.source)
  const frames = []
  for (const t of spec.times) {
    renderer.syncTime(t)
    renderer.render(t)
    const pipeline = renderer.pipeline
    const surface = pipeline.surfaces.get('o0')
    if (!surface) throw new Error(`o0 surface missing after render (t=${t})`)
    const px = await pipeline.backend.readPixels(surface.read)
    frames.push({
      key: spec.key, t,
      width: px.width ?? width, height: px.height ?? height,
      data: Array.from(px.data ?? px)
    })
  }
  return frames
}

// The gate driver runs one page at a time (a single live WebGL context per
// chromium) and calls this directly over the DevTools protocol; frame-by-frame
// comparison against the authority readbacks happens in the node driver, which
// reports exact equality separately from the legacy +-2 numerical contract.
window.__gateRun = async (programs) => {
  const portFrames = []
  for (const spec of programs) portFrames.push(...await renderFrames(spec))
  return portFrames
}
pre.textContent = 'port-ready'
window.parent.postMessage({ type: 'ready', side: 'port' }, '*')
</script></body></html>
