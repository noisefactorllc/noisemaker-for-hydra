<!doctype html>
<html><body>
<iframe id="auth" src="./authority.html" style="width:64px;height:48px"></iframe>
<iframe id="port" src="./port.html" style="width:64px;height:48px"></iframe>
<pre id="out">diag2-boot</pre>
<script type="module">
const pre = document.getElementById('out')
const ready = {}
const pending = new Map()
let nextId = 0
window.addEventListener('message', (ev) => {
  const msg = ev.data || {}
  if (msg.type === 'ready') { ready[msg.side] = true; return }
  const r = pending.get(msg.id)
  if (r) { pending.delete(msg.id); r(msg) }
})
function ask (side, payload) {
  const id = `m${nextId++}`
  return new Promise(res => {
    let t = setTimeout(() => { if (pending.has(id)) { pending.delete(id); res({ type: 'timeout' }) } }, 120000)
    pending.set(id, m => { clearTimeout(t); res(msg) })
    document.getElementById(side).contentWindow.postMessage({ ...payload, id }, '*')
  })
}
async function waitForReady () {
  const s = Date.now()
  while ((!ready.authority || !ready.port) && Date.now() - s < 300000) await new Promise(r => setTimeout(r, 100))
}
await waitForReady()
// Slice 60 order: index 60 = filter/mandala? figure actual source from fixture
const fixture = await (await fetch('/test/fixtures/parity-cases.json')).json()
const slice = fixture.cases.slice(60, 90)
const results = []
// Try the FIRST failing case alone (filter/octaveWarp is index? find)
const idx = fixture.cases.findIndex(c => c.id === 'filter/octaveWarp')
const c = fixture.cases[idx]
const programs = [
  { key: 'A', source: c.caseA.source, size: { width: 32, height: 24 }, times: [0, 0.37, 0.74] },
  { key: 'B', source: c.caseB.source, size: { width: 32, height: 24 }, times: [0, 0.37] }
]
const ar = await ask('auth', { type: 'authority-run', programs })
results.push({ stage: 'octaveWarp-AB', type: ar.type, error: (ar.error || '').slice(0, 200) })
const ar2 = await ask('auth', { type: 'authority-run', programs: [{ key: 'C', source: c.caseA.source, size: { width: 24, height: 18 }, times: [0] }] })
results.push({ stage: 'octaveWarp-C', type: ar2.type, error: (ar2.error || '').slice(0, 200) })
// now: repeated compiles of a WORKING effect to see if compile#N breaks
const ok = fixture.cases[0]
for (let i = 1; i <= 8; i++) {
  const r = await ask('auth', { type: 'authority-run', programs: [{ key: 'A', source: 'search filter, synth\nnoise().blur().write(o0)\nrender(o0)', size: { width: 32, height: 24 }, times: [0] }] })
  results.push({ stage: `repeat-compile-${i}`, type: r.type, error: (r.error || '').slice(0, 120) })
}
pre.textContent = JSON.stringify(results)
</script></body></html>
