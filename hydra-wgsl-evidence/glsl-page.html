<!doctype html>
<meta charset="utf-8">
<title>glsl reference</title>
<script type="module">
const CDN = 'https://shaders.noisedeck.app/1.0.182'
try {
  const mod = await import(`${CDN}/noisemaker-shaders-core.esm.min.js`)
  const companionSrc = await (await fetch('/companion.js')).text()
  ;(0, eval)(companionSrc)
  await window.HydraEffects.loadHydraEffects({ engine: mod })
  const renderer = new mod.CanvasRenderer({
    canvas: document.createElement('canvas'),
    width: 32,
    height: 24,
    basePath: CDN,
    bundlePath: `${CDN}/effects`,
    useBundles: true,
    preferWebGPU: false
  })
  await renderer.loadManifest()
  await renderer.loadEffects(Object.keys(renderer.manifest || {}))
  renderer.start()
  renderer.stop()
  window.__run = async (programs) => {
    const results = []
    for (const prog of programs) {
      for (const label of ['defaults', 'varied']) {
        const source = prog[label]
        if (!source) continue
        const item = { name: prog.name, case: label }
        try {
          await renderer.compile(source)
          renderer.syncTime(0)
          renderer.render(0)
          const pipeline = renderer.pipeline
          const surface = pipeline.surfaces.get('o0')
          const px = await pipeline.backend.readPixels(surface.read)
          item.data = Array.from(px.data ?? px).slice(0, 32 * 24 * 4)
        } catch (err) {
          item.error = JSON.stringify({ code: err.code, message: err.message, diagnostics: err.diagnostics }).slice(0, 800)
        }
        results.push(item)
      }
    }
    return results
  }
  window.__ready = true
} catch (err) {
  window.__error = String(err && (err.stack || err.message || err)).slice(0, 2000)
}
</script>
