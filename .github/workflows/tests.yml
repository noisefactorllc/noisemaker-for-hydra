name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No binary links and no lifecycle scripts: this tree forbids symbolic links.
      - name: Install dependencies
        run: npm ci --bin-links=false --ignore-scripts

      - name: Unit and compiler tests
        run: node --test test/*.test.mjs

      - name: Build
        run: node node_modules/vite/bin/vite.js build

      - name: Install Chrome
        run: npx --yes @puppeteer/browsers install chrome@stable --path .browsers

      - name: Browser editor checks
        run: |
          CHROME="$(find .browsers -type f -name chrome | head -1)"
          export CHROME
          node scripts/test.mjs
