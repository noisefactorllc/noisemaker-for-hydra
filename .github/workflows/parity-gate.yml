name: Rendered parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on:
      group: hydra-gpu
    timeout-minutes: 90
    env:
      GATE_GL_BACKEND: native
      GATE_BATCH: '5'
      CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Check office GPU tools
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/homebrew/bin/node
          test -x "$CHROME"
          test "$(/opt/homebrew/bin/node --version)" = v26.0.0
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --bin-links=false
      - name: Test and render current source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-receipts"
          {
            git rev-parse HEAD
            uname -a
            node --version
            "$CHROME" --version
            shasum -a 256 test/fixtures/parity-cases.json
          } | tee "$RUNNER_TEMP/parity-receipts/identity.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/parity-receipts/unit.log"
          TMPDIR="$RUNNER_TEMP/parity-receipts" node scripts/parity-summary 2>&1 | tee "$RUNNER_TEMP/parity-receipts/render.log"
          grep -F 'PARITY-SUMMARY {"expected":210,"executed":210,"exact":210,"strict":0,"near":0,"defer":0,"skip":0,"fail":0,"missing":0}' "$RUNNER_TEMP/parity-receipts/render.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hydra-parity-${{ github.sha }}
          path: ${{ runner.temp }}/parity-receipts/
          if-no-files-found: warn

  browser-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
      - name: Check Windows browser and source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'browser-receipts'
          New-Item -ItemType Directory -Force $receipt | Out-Null
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -PathType Leaf $chrome)) { throw "Chrome missing: $chrome" }
          "CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA) { throw "Checkout $source differs from workflow source $env:GITHUB_SHA" }
          @(
            "source=$source"
            "os=$([System.Environment]::OSVersion.VersionString)"
            "node=$(node --version)"
            "chrome_product_version=$((Get-Item $chrome).VersionInfo.ProductVersion)"
          ) | Tee-Object -FilePath (Join-Path $receipt 'identity.log')
          if ((node --version) -notmatch '^v26\.') { throw 'Node 26 required' }
      - run: npm ci --ignore-scripts --bin-links=false
      - name: Verify Windows WebGL2 and editor workflows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'browser-receipts'
          $html = '<body><script>const gl=document.createElement("canvas").getContext("webgl2");const ext=gl?.getExtension("WEBGL_debug_renderer_info");document.body.textContent="HYDRA_WEBGL_PROBE="+JSON.stringify({webgl2:!!gl,userAgent:navigator.userAgent,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):null})</script>'
          $url = 'data:text/html,' + [uri]::EscapeDataString($html)
          & $env:CHROME --headless=new --no-sandbox --dump-dom $url 2>&1 | Tee-Object -FilePath (Join-Path $receipt 'webgl.log') | Out-Null
          $probeExit = $LASTEXITCODE
          "exit_code=$probeExit" | Add-Content (Join-Path $receipt 'webgl.log')
          if ($probeExit -ne 0) { throw "Chrome WebGL probe exited $probeExit" }
          $probeLog = Get-Content -Raw (Join-Path $receipt 'webgl.log')
          if ($probeLog -notmatch 'HYDRA_WEBGL_PROBE=([^<]+)') { throw 'WebGL probe output missing' }
          $probe = [System.Net.WebUtility]::HtmlDecode($Matches[1]) | ConvertFrom-Json
          if (-not $probe.webgl2) { throw 'WebGL2 unavailable in Windows Chrome' }
          "webgl2=$($probe.webgl2) renderer=$($probe.renderer)" | Tee-Object -FilePath (Join-Path $receipt 'webgl-summary.log')
          & node scripts/test.mjs 2>&1 | Tee-Object -FilePath (Join-Path $receipt 'editor.log')
          $editorExit = $LASTEXITCODE
          "exit_code=$editorExit" | Add-Content (Join-Path $receipt 'editor.log')
          if ($editorExit -ne 0) { throw "Editor suite exited $editorExit" }
          $passes = @(Get-Content (Join-Path $receipt 'editor.log') | Where-Object { $_ -match '^\[editor-test\] PASS ' })
          if ($passes.Count -ne 12) { throw "Expected 12 editor passes, got $($passes.Count)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hydra-windows-browser-${{ github.sha }}
          path: ${{ runner.temp }}/browser-receipts/
          if-no-files-found: warn
