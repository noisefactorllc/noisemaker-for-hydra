name: Rendered parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GATE_GL_BACKEND: native
      GATE_BATCH: '5'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --bin-links=false
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          npx -y playwright@1.56.1 install chromium
          CHROME_BIN=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name headless_shell -print -quit)
          test -x "$CHROME_BIN"
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Test and render current source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-receipts"
          {
            git rev-parse HEAD
            uname -a
            node --version
            "$CHROME" --version
            shasum -a 256 test/fixtures/parity-cases.json
          } | tee "$RUNNER_TEMP/parity-receipts/identity.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/parity-receipts/unit.log"
          TMPDIR="$RUNNER_TEMP/parity-receipts" node scripts/parity-summary 2>&1 | tee "$RUNNER_TEMP/parity-receipts/render.log"
          grep -F 'PARITY-SUMMARY {"expected":210,"executed":210,"exact":210,"strict":0,"near":0,"defer":0,"skip":0,"fail":0,"missing":0}' "$RUNNER_TEMP/parity-receipts/render.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hydra-parity-${{ github.sha }}
          path: ${{ runner.temp }}/parity-receipts/
          if-no-files-found: warn
