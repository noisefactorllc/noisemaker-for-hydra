name: Rendered parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on:
      group: hydra-gpu
    timeout-minutes: 90
    env:
      GATE_GL_BACKEND: native
      GATE_BATCH: '5'
      CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Check office GPU tools
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/homebrew/bin/node
          test -x "$CHROME"
          test "$(/opt/homebrew/bin/node --version)" = v26.0.0
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --bin-links=false
      - name: Test and render current source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-receipts"
          {
            git rev-parse HEAD
            uname -a
            node --version
            "$CHROME" --version
            shasum -a 256 test/fixtures/parity-cases.json
          } | tee "$RUNNER_TEMP/parity-receipts/identity.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/parity-receipts/unit.log"
          TMPDIR="$RUNNER_TEMP/parity-receipts" node scripts/parity-summary 2>&1 | tee "$RUNNER_TEMP/parity-receipts/render.log"
          grep -F 'PARITY-SUMMARY {"expected":210,"executed":210,"exact":210,"strict":0,"near":0,"defer":0,"skip":0,"fail":0,"missing":0}' "$RUNNER_TEMP/parity-receipts/render.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hydra-parity-${{ github.sha }}
          path: ${{ runner.temp }}/parity-receipts/
          if-no-files-found: warn
